services:
  muse2api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INCLUDE_BROWSER: ${MUSE_INCLUDE_BROWSER:-0}
    image: muse2api-python-protocol:local
    # Chromium can orphan children; PID 1 must forward signals and reap them.
    init: true
    restart: unless-stopped
    ports:
      - "${MUSE_BIND_ADDRESS:-127.0.0.1}:18610:18610"
    environment:
      MUSE_BACKEND: ${MUSE_BACKEND:-protocol}
      MUSE2API_KEY: ${MUSE2API_KEY:?Set MUSE2API_KEY in the environment or an explicit --env-file}
      MUSE2API_PUBLIC_BASE: ${MUSE2API_PUBLIC_BASE:-}
      MUSE2API_IMAGE_TIMEOUT: ${MUSE2API_IMAGE_TIMEOUT:-240}
      MUSE2API_VIDEO_TIMEOUT: ${MUSE2API_VIDEO_TIMEOUT:-600}
      MUSE2API_CHAT_TIMEOUT: ${MUSE2API_CHAT_TIMEOUT:-300}
      MUSE2API_CONCURRENCY: ${MUSE2API_CONCURRENCY:-2}
      MUSE_PROTOCOL_MEDIA_MAX_BYTES: ${MUSE_PROTOCOL_MEDIA_MAX_BYTES:-268435456}
      MUSE_PROTOCOL_IMPERSONATE: ${MUSE_PROTOCOL_IMPERSONATE:-chrome}
      MUSE_PROTOCOL_SHUTDOWN_TIMEOUT: ${MUSE_PROTOCOL_SHUTDOWN_TIMEOUT:-15}
    volumes:
      - ./data:/app/data
    # Needed only when INCLUDE_BROWSER=1 and MUSE_BACKEND=browser.
    shm_size: "2gb"
